name: 功能建议 / Feature Request
description: 希望增加功能或改善体验？说说你的使用场景。Suggest a feature or improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: 平台 / Platform
      description: 选择希望支持的平台，可多选。不确定时选择你正在使用的平台。Choose one or more platforms.
      multiple: true
      options:
        - Windows
        - macOS
        - iOS
        - Linux
        - 引擎（所有平台共享）/ Engine (shared by all platforms)
        - 文档 / Docs
        - 官网 / Website
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题 / What problem does this solve
      description: 说说你在什么情况下遇到不便，以及它对你的影响。不需要了解技术实现。Describe your situation and the difficulty.
      placeholder: 例如：在高分辨率屏幕上打字时，候选字太小，看清后才能选字，打字容易中断。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 设想的做法 / Proposed behaviour
      description: 描述你希望达到的效果即可，不用设计实现方案。还没想好可以跳过。Describe the result you would like; an implementation plan is not needed.
      placeholder: 例如：希望能在设置里调大候选字，并立即看到调整效果。
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认 / Checklist
      options:
        - label: 我已搜索过现有 Issue 与 Discussions。I searched existing issues and discussions.
          required: true
