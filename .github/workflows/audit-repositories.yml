name: Organization CI coverage
on:
  push:
    branches: [main]
    paths: [tools/audit_repositories.py, .github/workflows/audit-repositories.yml]
  pull_request:
    paths: [tools/audit_repositories.py, .github/workflows/audit-repositories.yml]
  schedule:
    - cron: '17 5 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: organization-ci-audit
  cancel-in-progress: false
jobs:
  coverage:
    name: Maintained repository coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Audit the current default branches of maintained public repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/audit_repositories.py
